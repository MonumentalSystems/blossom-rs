[package]
name = "blossom-cli"
version = "0.6.0"
edition = "2021"
rust-version = "1.94.1"
description = "CLI client for Blossom blob storage — upload, download, mirror, keygen with BIP-340 Nostr auth"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MonumentalSystems/blossom-rs"
keywords = ["blossom", "nostr", "cli", "blob", "storage"]
categories = ["command-line-utilities"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/build.rs", "/src/**", "/tests/**"]

[dependencies]
blossom-rs = { path = "..", version = "0.6.0", features = ["client", "iroh-transport", "pkarr-discovery"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "rustls"] }
hex = "0.4"
bech32 = "0.12"
iroh = "1.0.3"
tracing = "0.1"
pkarr = { version = "8", default-features = false }

[build-dependencies]
sha2 = "0.11"
hex = "0.4"
serde_json = "1.0"

[dev-dependencies]
blossom-rs = { path = "..", version = "0.6.0", features = ["server", "client", "filesystem", "iroh-transport"] }
axum = "0.8"
