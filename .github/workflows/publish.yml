name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo test --workspace

  publish-lib:
    needs: test
    runs-on: self-hosted
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo publish -p blossom-rs --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-nip34:
    needs: publish-lib
    runs-on: self-hosted
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: sleep 30
      - run: cargo publish -p blossom-nip34 --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-server:
    needs: [publish-lib, publish-nip34]
    runs-on: self-hosted
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: sleep 30
      - run: cargo publish -p blossom-server --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-cli:
    needs: publish-lib
    runs-on: self-hosted
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: sleep 30
      - run: cargo publish -p blossom-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-binaries:
    needs: test
    runs-on: self-hosted
    environment: crates-io
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Resolve trusted release signer
        id: release-signer
        env:
          BLOSSOM_RELEASE_NSEC: ${{ secrets.BLOSSOM_RELEASE_NSEC }}
        run: |
          test -n "$BLOSSOM_RELEASE_NSEC"
          signer_pubkey="$(cargo xtask release-signer-pubkey)"
          echo "pubkey=$signer_pubkey" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        env:
          BLOSSOM_TRUSTED_RELEASE_SIGNERS: ${{ steps.release-signer.outputs.pubkey }}
        run: cargo build --release --workspace

      - name: Sign release manifest (blossom-server)
        env:
          BLOSSOM_RELEASE_NSEC: ${{ secrets.BLOSSOM_RELEASE_NSEC }}
        run: cargo xtask sign-release-manifest --bin target/release/blossom-server

      - name: Sign release manifest (blossom-cli)
        env:
          BLOSSOM_RELEASE_NSEC: ${{ secrets.BLOSSOM_RELEASE_NSEC }}
        run: cargo xtask sign-release-manifest --bin target/release/blossom-cli

      - name: Generate source Merkle tree
        env:
          BLOSSOM_RELEASE_NSEC: ${{ secrets.BLOSSOM_RELEASE_NSEC }}
        run: |
          cargo xtask source-merkle-tree --output target/release/source-merkle-tree.json

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" \
            target/release/blossom-server \
            target/release/blossom-cli \
            target/release/blossom-server.manifest.json \
            target/release/blossom-cli.manifest.json \
            target/release/source-merkle-tree.json \
            --clobber
