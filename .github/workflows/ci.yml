name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Trusted CI — runs on self-hosted runner for pushes to master.
  ci-trusted:
    if: github.event_name == 'push'
    runs-on: self-hosted
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Install Gitleaks 8.28.0
        run: bash .github/scripts/install-gitleaks.sh
      - name: Scan pushed commits for secrets
        run: gitleaks git . --redact --verbose --log-opts='${{ github.event.before }}..${{ github.sha }}'
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main (Node 24)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # PR CI — runs on GitHub-hosted runner for pull requests.
  ci-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Install Gitleaks 8.28.0
        run: bash .github/scripts/install-gitleaks.sh
      - name: Scan pull request commits for secrets
        run: gitleaks git . --redact --verbose --log-opts='${{ github.event.pull_request.base.sha }}..${{ github.sha }}'
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main (Node 24)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
