[package]
name = "blossom-nip34"
version = "0.6.1"
edition = "2021"
rust-version = "1.94.1"
description = "NIP-34 Nostr relay + GRASP git server library for Blossom"
license = "MIT"
repository = "https://github.com/MonumentalSystems/blossom-rs"
keywords = ["nostr", "nip34", "git", "relay", "grasp"]
categories = ["web-programming", "development-tools"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**", "/tests/**"]

[dependencies]
# Nostr relay infrastructure (MIT)
nostr = { version = "0.44.8", default-features = false, features = ["std"] }
nostr-database = "0.45"
nostr-lmdb = "0.44"
nostr-relay-builder = "0.44"

# HTTP framework
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-http = { version = "0.7", features = ["cors", "timeout", "trace"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }

# Async
tokio = { version = "1", features = ["process", "fs", "io-util", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observability
tracing = "0.1"

# Database (policy persistence)
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "postgres"] }

# Utilities
hex = "0.4"
url = "2"
sha2 = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
futures-core = "0.3"
