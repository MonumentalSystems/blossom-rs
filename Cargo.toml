[workspace]
members = [".", "blossom-server", "blossom-cli", "xtask", "blossom-nip34"]

[package]
name = "blossom-rs"
version = "0.6.0"
edition = "2021"
rust-version = "1.94.1"
description = "Full-featured Blossom (BUD-01) blob storage library for Rust — embeddable server, async client, BIP-340 Nostr auth"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MonumentalSystems/blossom-rs"
keywords = ["blossom", "nostr", "blob", "storage", "bip340"]
categories = ["web-programming", "cryptography"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/RELEASE_NOTES.md",
    "/build.rs",
    "/docs/**",
    "/src/**",
    "/tests/**",
    "/vendor/xdelta3/**",
]

[features]
default = ["server", "client", "filesystem", "iroh-transport", "pkarr-discovery", "otel", "db-sqlite"]

# Core
server = ["dep:axum", "dep:tower-http", "dep:reqwest"]
client = ["dep:reqwest"]
filesystem = []

# Storage backends
s3 = ["dep:aws-sdk-s3", "dep:aws-config"]
s3-compat = ["server"]

# Database backends
db-sqlite = ["dep:sqlx"]
db-postgres = ["dep:sqlx"]

# Media processing
media = ["dep:image", "dep:webp", "dep:blurhash", "dep:kamadak-exif"]

# Content labeling
labels = []

# P2P transport via iroh QUIC
iroh-transport = ["dep:iroh", "dep:anyhow"]

# PKARR discovery — publish/resolve blossom endpoints via Mainline DHT
pkarr-discovery = ["dep:pkarr", "iroh-transport"]

# Observability — opt-in OTEL export support for consumers
otel = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-subscriber"]

[dependencies]
# Crypto
secp256k1 = { version = "0.31.1", features = ["rand", "global-context"] }
sha2 = "0.11"
hex = "0.4"
bech32 = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1", features = ["sync", "time", "fs", "rt-multi-thread", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }

# Logging / tracing
tracing = "0.1"

# Error handling
thiserror = "2"

# UUID generation for lock IDs
uuid = { version = "1", features = ["v4"] }

# Server (optional)
axum = { version = "0.8", features = ["ws"], optional = true }
tower-http = { version = "0.7", features = ["cors", "limit", "trace"], optional = true }

# Client (optional)
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "rustls", "stream"], optional = true }

# S3 (optional)
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"], optional = true }
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process"], optional = true }

# Database (optional)
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "postgres"], optional = true }

# Media processing (optional)
image = { version = "0.25", optional = true }
webp = { version = "0.3", optional = true }
blurhash = { version = "0.2", optional = true }
kamadak-exif = { version = "0.6", optional = true }

# Content labeling (optional)
# OpenTelemetry (optional)
tracing-opentelemetry = { version = "0.33", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32.1", optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic"], optional = true }

# P2P transport (optional)
iroh = { version = "1.0.3", optional = true }
anyhow = { version = "1", optional = true }

# PKARR discovery (optional)
# The current publisher and resolver use PKARR's relay client, so direct
# Mainline DHT support is not enabled in the library dependency surface.
pkarr = { version = "8", default-features = false, features = ["relays", "signed_packet"], optional = true }

# Statistics
dashmap = "6"
zstd = "0.13.3"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "rustls"] }
rand = "0.10"
tempfile = "3"
proptest = "1"
serial_test = "4.0.1"
futures-core = "0.3"
