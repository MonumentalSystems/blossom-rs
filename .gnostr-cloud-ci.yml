# gnostr-cloud (uranus) NATIVE CI — blossom-rs workspace.
#
# NOT GitHub Actions: this is the native GitLab-style schema the uranus
# executor runs directly in the gVisor `ariel` ci-runner pod (no wrkflw,
# no `container:`, no docker socket). The auto-poll scanner enqueues THIS
# file (`.gnostr-cloud-ci.yml`) on every push to the rule branches and on
# every matching tag.
#
# Pipeline:
#   validate (master/main push + v* tag):  fmt -> clippy -> test
#   publish  (v* tag only, needs the test job): push blossom-rs (+ the
#            independently-useful blossom-nip34) to the /crates registry.
#
# ariel conventions: real $HOME is not writable in the pod, so every job
# exports HOME=/tmp + CARGO_HOME=/tmp/cargo and prepends the cargo/tool
# bin dirs to PATH. cargo, cargo-llvm-cov and gnostr-cloud-cli are all on
# the image's default PATH; the repo is materialized at cwd = repo root.

stages:
  - validate
  - publish
  - release

variables:
  CARGO_TERM_COLOR: always
  GNOSTR_CLOUD_RELAYS: ""
  # Debug+instrument builds with full DWARF are huge on this workspace
  # (axum + aws-sdk + iroh + nostr-lmdb). Keep file:line for useful
  # backtraces but drop the rest; incremental is useless in CI.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  # STABLE target dir = the actual sccache Rust-hit fix. The runner hands
  # every job a fresh per-commit workdir; with the default `<workdir>/target`
  # the dependency `-L`/`--extern`/`--out-dir` paths differ every run, so
  # every Rust compile is a fresh sccache key -> "Cache hits rate (Rust)
  # 0.00%" even with a warm cache. Pinning CARGO_TARGET_DIR to a persistent
  # path under /cache (mounted on the ariel runner — these jobs run natively
  # on ariel with no `container:`, so /cache is the host cache dir sccache
  # writes to) makes all the registry-dep compiles — the bulk —
  # sccache-cacheable across runs. The scripts export HOME=/tmp +
  # CARGO_HOME=/tmp/cargo but NOT CARGO_TARGET_DIR, so this survives. The
  # path is per-repo (ariel runs EVERY repo's lint job — a shared dir would
  # thrash/corrupt across repos), so the leaf is this repo's slug.
  CARGO_TARGET_DIR: /cache/ci-target/blossom-rs

jobs:
  format:
    stage: validate
    runs-on: ariel
    # Run on master pushes AND on every v* tag so the stage in front of
    # `publish` is non-empty on a tag pipeline (a tag pipeline with only
    # `publish` would have no predecessor stage to gate against).
    rules:
      branches:
        - master
      tags:
        - v*
    script:
      - |
        set -euo pipefail
        export HOME=/tmp CARGO_HOME=/tmp/cargo
        export PATH="/tmp/cargo/bin:/usr/local/bin:$PATH"
        cargo --version; rustc --version
        cargo fmt --all -- --check

  lint:
    stage: validate
    runs-on: ariel
    needs: [format]
    rules:
      branches:
        - master
      tags:
        - v*
    script:
      - |
        set -euo pipefail
        export HOME=/tmp CARGO_HOME=/tmp/cargo
        export PATH="/tmp/cargo/bin:/usr/local/bin:$PATH"
        # --all-targets gives one full rustc pass over lib+bins+tests, so
        # it also catches test-construction breakage before it ships.
        cargo clippy --workspace --all-targets -- -D warnings

  test:
    stage: validate
    runs-on: ariel
    needs: [lint]
    rules:
      branches:
        - master
      tags:
        - v*
    script:
      - |
        set -euo pipefail
        export HOME=/tmp CARGO_HOME=/tmp/cargo
        export PATH="/tmp/cargo/bin:/usr/local/bin:$PATH"
        # blossom-rs is sqlite-backed; the lib + e2e + nip34 + lock/storage
        # suites run hermetically (255 tests, 0 failures on ariel). The
        # tests/iroh_integration.rs cases (test_iroh_*) need two iroh endpoints
        # to discover each other over n0 DERP/QUIC — which the gVisor (runsc)
        # ci-runner pod can't do (no UDP/NAT hole-punching; same in-pod iroh
        # discovery limitation we hit elsewhere), so they hang on discovery
        # timeouts (~440s) then fail. Skip them by name here; they're meant for
        # a host with real networking (run locally / on a non-gVisor runner).
        cargo test --workspace -- --skip test_iroh

  publish:
    # Tag-gated publish of the library crate(s) to the gnostr-cloud
    # /crates registry. Registry versions are IMMUTABLE, so the crate
    # version bump in Cargo.toml IS the release gate — no `|| true`
    # swallowing. `registry publish <dir>` runs `cargo package` itself.
    # Auth: the runner injects $GNOSTR_CLOUD_RELEASE_NSEC (the release
    # signer key); the CLI reads the signing key from NOSTR_PRIVATE_KEY.
    stage: publish
    runs-on: ariel
    needs: [test]
    rules:
      tags:
        - v*
    script:
      - |
        set -euo pipefail
        export HOME=/tmp CARGO_HOME=/tmp/cargo
        export PATH="/tmp/cargo/bin:/usr/local/bin:$PATH"
        : "${GNOSTR_CLOUD_RELEASE_NSEC:?GNOSTR_CLOUD_RELEASE_NSEC secret required (gnostr-cloud-cli ci set-secret)}"

        REGISTRY="https://uranus.gnostr.cloud"

        # Root workspace crate: blossom-rs (the `.` crate dir).
        env NOSTR_PRIVATE_KEY="$GNOSTR_CLOUD_RELEASE_NSEC" \
          gnostr-cloud-cli registry publish --registry "$REGISTRY" --public .

        # blossom-nip34 is independently useful (standalone NIP-34 relay +
        # GRASP git-server lib), and is published as its own crate on the
        # public index too — mirror that here.
        env NOSTR_PRIVATE_KEY="$GNOSTR_CLOUD_RELEASE_NSEC" \
          gnostr-cloud-cli registry publish --registry "$REGISTRY" --public ./blossom-nip34

        # NOTE: blossom-server + blossom-cli are NOT auto-published here as
        # CRATES. They depend on blossom-rs/blossom-nip34 BY VERSION, and
        # `cargo package` resolves those deps against crates.io (their primary
        # index, which lags our registry), so a fresh-version crate publish
        # fails "failed to select a version for blossom-nip34". Publishing the
        # apps as crates to our registry would need their inter-crate deps
        # pinned to `registry = "gnostr"` (which would break their crates.io
        # release). The libraries (blossom-rs, blossom-nip34) are the
        # registry-consumable CRATES; the apps live on crates.io. Their
        # prebuilt EXECUTABLES are published as PUBLIC release BINARIES by the
        # `release` stage below (attached to the blossom-rs crate version) — no
        # cargo-package dep resolution involved, so the dual-registry wall
        # doesn't apply.

  release:
    # Tag-gated PUBLIC binary release of the two executables (blossom-server
    # daemon + blossom-cli) for BOTH linux targets (aarch64 native + x86_64
    # cross), surfaced on /releases. A release binary is keyed by
    # (crate, version, target); both executables attach to the already-published
    # `blossom-rs` crate version (created by the `publish` job this stage
    # `needs:`), distinguished by a binary-name-prefixed target label.
    # `--public` makes them anonymously downloadable even though some blossom
    # apps' source isn't on our index.
    #
    # The ariel runner is aarch64 (gVisor, no docker), so x86_64 is produced by
    # a NATIVE gcc cross-compile (cc crate picks $CC_x86_64_unknown_linux_gnu
    # for the vendored xdelta3). This needs the cross toolchain in the runner image:
    #   x86_64-linux-gnu-gcc (gcc-x86-64-linux-gnu) + /usr/x86_64-linux-gnu
    #   headers (libc6-dev-amd64-cross) + the x86_64 rust target.
    # The x86_64 leg is best-effort: if the toolchain/target is absent it logs
    # and skips rather than failing the release (the aarch64 leg still ships).
    stage: release
    runs-on: ariel
    needs: [publish]
    rules:
      tags:
        - v*
    script:
      - |
        set -euo pipefail
        export HOME=/tmp CARGO_HOME=/tmp/cargo
        export PATH="/tmp/cargo/bin:/usr/local/bin:$PATH"
        : "${GNOSTR_CLOUD_RELEASE_NSEC:?GNOSTR_CLOUD_RELEASE_NSEC secret required (gnostr-cloud-cli ci set-secret)}"

        REGISTRY="https://uranus.gnostr.cloud"

        VERSION="$(cargo metadata --no-deps --format-version 1 \
          | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="blossom-rs"))')"
        HOST_TRIPLE="$(rustc -vV | awk '/^host:/ {print $2}')"
        STAGE="$(mktemp -d)"
        export BLOSSOM_RELEASE_NSEC="$(openssl rand -hex 32)"
        export BLOSSOM_TRUSTED_RELEASE_SIGNERS="$(cargo xtask release-signer-pubkey)"
        cargo xtask source-merkle-tree --output "$STAGE/source-merkle-tree.json"

        publish_target() {
          # $1 = target triple, $2 = path to the release dir holding the bins
          local triple="$1" outdir="$2"
          for BIN in blossom-server blossom-cli; do
            test -x "$outdir/$BIN"
            cargo xtask sign-release-manifest --bin "$outdir/$BIN"
            tar czf "$STAGE/$BIN-$triple.tar.gz" \
              -C "$outdir" "$BIN" "$BIN.manifest.json" \
              -C "$STAGE" source-merkle-tree.json
            env NOSTR_PRIVATE_KEY="$GNOSTR_CLOUD_RELEASE_NSEC" \
              gnostr-cloud-cli registry upload-binary \
                blossom-rs "$VERSION" "$BIN-$triple" \
                "$STAGE/$BIN-$triple.tar.gz" \
                --registry "$REGISTRY" --public
            echo "published release binary: blossom-rs $VERSION $BIN-$triple"
          done
        }

        # ── Native target (aarch64 on ariel) ──────────────────────────────
        echo "release: blossom-rs@$VERSION native target=$HOST_TRIPLE"
        cargo build --release -p blossom-server -p blossom-cli
        publish_target "$HOST_TRIPLE" "target/release"

        # ── x86_64 cross target (best-effort) ─────────────────────────────
        XT=x86_64-unknown-linux-gnu
        if [ "$HOST_TRIPLE" != "$XT" ] \
           && command -v x86_64-linux-gnu-gcc >/dev/null 2>&1 \
           && rustup target list --installed 2>/dev/null | grep -qx "$XT"; then
          echo "release: blossom-rs@$VERSION cross target=$XT"
          if env \
              CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=x86_64-linux-gnu-gcc \
              CC_x86_64_unknown_linux_gnu=x86_64-linux-gnu-gcc \
              AR_x86_64_unknown_linux_gnu=x86_64-linux-gnu-ar \
              cargo build --release --target "$XT" -p blossom-server -p blossom-cli; then
            publish_target "$XT" "target/$XT/release"
          else
            echo "WARN: x86_64 cross build failed — shipping aarch64 only this release"
          fi
        else
          echo "WARN: x86_64 cross toolchain/target absent — shipping aarch64 only (install gcc-x86-64-linux-gnu + libc6-dev-amd64-cross + rustup target add $XT in the runner image)"
        fi
